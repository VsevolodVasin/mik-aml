name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VER="${VERSION#v}"
          export VERSION="$VER"
          chmod +x scripts/build_dmg.sh
          ./scripts/build_dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mik-aml-dmg
          path: dist/MIK-AML-*.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DMG=$(ls dist/MIK-AML-*.dmg | head -1)
          gh release create "$TAG" "$DMG" \
            --title "MIK-AML ${TAG}" \
            --notes "macOS DMG — Vsevolod Vasin

See README and THIRD_PARTY.md for license and dependencies.
Requires: brew install e2fsprogs; Khadas aml-burn-tool for USB flash."
